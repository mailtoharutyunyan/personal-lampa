<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lampa</title>
    <meta name="referrer" content="never">
    <link rel="stylesheet" href="./vender/scrollbar/jquery.scrollbar.css">
    <link rel="stylesheet" href="./vender/keypad/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body style="background: #1d1f20;">
    <script>window.youtube_lazy_load = true</script>
    <div class="welcome"></div>
    <div id="app"></div>

    <script src="./webos/webOSTV.js"></script>
    <script src="./vender/jquery/jquery.js"></script>
    <script src="./vender/notify/notify.js"></script>
    <script src="./vender/scrollbar/jquery.scrollbar.js"></script>
    <script src="./vender/navigator/navigator.js"></script>
    <script src="./vender/keypad/keypad.js"></script>

    <script>
    (function(){
        // Bump VERSION whenever the plugin list or our own plugins change.
        // Every device re-seeds this list on the next reload (no manual clearing).
        var VERSION = '20261008d';
        var v = '?v=' + VERSION;
        var urls = [
                // --- Streaming / 4K (free, no account) ---
                'https://nb557.github.io/plugins/online_mod.js',
                'https://mailtoharutyunyan.github.io/personal-lampa/vk4k.js' + v,
                'https://mailtoharutyunyan.github.io/personal-lampa/torrents4k.js' + v,
                'https://mailtoharutyunyan.github.io/personal-lampa/torrserver_config.js' + v,
                'https://mailtoharutyunyan.github.io/personal-lampa/browser_fullscreen.js' + v,
                'https://bylampa.github.io/in_quality.js',
                'https://num.jac-red.ru/plugin/nmprs.js',
                'https://levende.github.io/lampa-plugins/balancer-sanitizer.js',
                // --- UI / core (https) ---
                'https://cub.red/plugin/interface','https://cub.red/plugin/quality',
                'https://cub.red/plugin/tmdb-proxy','https://cub.red/plugin/collections',
                'https://nb557.github.io/plugins/rating.js',
                'https://bylampa.github.io/interface.js','https://bylampa.github.io/start.js',
                'https://bylampa.github.io/source.js','https://lampame.github.io/main/newcategory.js',
                'https://andreyurl54.github.io/diesel5/tricks.js',
                'https://github.freebie.tom.ru/want.js',
                'https://lampaplugins.github.io/store/fx.js','https://lampaplugins.github.io/store/p.js',
                'https://lampaplugins.github.io/store/logo.js','https://tsynik.github.io/lampa/e.js',
                'https://nb557.github.io/plugins/not_mobile.js',
                'https://nb557.github.io/plugins/reset_subs.js',
                // --- Torrents (free) ---
                'https://cub.red/plugin/etor','https://bylampa.github.io/jackett.js',
                'https://plugin.rootu.top/ts-preload.js',
                'https://github.freebie.tom.ru/torrents.js','https://lampame.github.io/main/pubtorr.js',
                'https://lampame.github.io/main/cts.js',
                // --- IPTV / TV (free) ---
                'https://cub.red/plugin/iptv','https://bylampa.github.io/tv.js',
                'https://plugin.rootu.top/tv.js',
                // --- Extras (free) ---
                'https://tsynik.github.io/lampa/soma.js','https://lampame.github.io/main/music.js',
                'https://lampaplugins.github.io/store/record.js',
                'https://bylampa.github.io/weather.js',
                'https://levende.github.io/lampa-plugins/bookmarks-sync.js',
                'https://levende.github.io/lampa-plugins/profiles.js',
                'https://levende.github.io/lampa-plugins/tmdb-networks.js',
                'https://levende.github.io/lampa-plugins/custom-favs.js',
                'https://levende.github.io/lampa-plugins/trash-filter.js',
                'https://levende.github.io/lampa-plugins/history-filter.js',
                'https://levende.github.io/lampa-plugins/random-scheduled.js'
            ];
        try {
            if (localStorage.getItem('plugins_version') !== VERSION) {
                var plugins = urls.map(function(u){ return {url:u,status:1,name:'',author:''}; });
                localStorage.setItem('plugins', JSON.stringify(plugins));
                localStorage.setItem('plugins_version', VERSION);
            }
        } catch(e){}
    })();
    </script>

    <script src="app.min.js"></script>
</body>
</html>
